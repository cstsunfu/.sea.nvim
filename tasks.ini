[file-build]
command:c,cpp=clang++ -O2 -Wall "$(VIM_FILEPATH)" -o "$(VIM_PATHNOEXT)" -lstdc++ -lm -std=c++20
command:go=go build -o "$(VIM_PATHNOEXT)" "$(VIM_FILEPATH)"
command:make=make -f "$(VIM_FILEPATH)"
command:tex=xelatex --shell-escape "$(VIM_FILENOEXT)" && bibtex "$(VIM_FILENOEXT)" && xelatex --shell-escape "$(VIM_FILENOEXT)"
output=quickfix
cwd=$(VIM_FILEDIR)
save=2


[file-run]
command="$(VIM_FILEPATH)"
command:c,cpp="$(VIM_PATHNOEXT)"
command:go="$(VIM_PATHNOEXT)"
command:python=python "$(VIM_FILENAME)"
command:javascript=node "$(VIM_FILENAME)"
command:sh=sh "$(VIM_FILENAME)"
command:lua=nvim --clean -l "$(VIM_FILENAME)"
command:perl=perl "$(VIM_FILENAME)"
command:ruby=ruby "$(VIM_FILENAME)"
output=quickfix
cwd=$(VIM_FILEDIR)

[typescript-check]
command=PATH="/opt/homebrew/opt/node@22/bin:$PATH"; export PATH; TOOLS="${NVIM_TYPESCRIPT_TOOLS:-$HOME/.local/share/nvim/typescript-tools}"; TSC="$(VIM_ROOT)/node_modules/.bin/tsc"; [ -x "$TSC" ] || TSC="$TOOLS/node_modules/.bin/tsc"; if [ -f "$(VIM_ROOT)/tsconfig.json" ]; then "$TSC" --noEmit --pretty false --project "$(VIM_ROOT)/tsconfig.json"; else "$TSC" --noEmit --pretty false --target ES2022 --module NodeNext --moduleResolution NodeNext "$(VIM_FILEPATH)"; fi
output=quickfix
cwd=$(VIM_ROOT)
save=2
errorformat=%f(%l\,%c):\ %m

[typescript-run]
command=PATH="/opt/homebrew/opt/node@22/bin:$PATH"; export PATH; TOOLS="${NVIM_TYPESCRIPT_TOOLS:-$HOME/.local/share/nvim/typescript-tools}"; if [ -x "$(VIM_ROOT)/node_modules/.bin/tsx" ]; then "$(VIM_ROOT)/node_modules/.bin/tsx" "$(VIM_FILEPATH)"; else "$TOOLS/node_modules/.bin/tsx" "$(VIM_FILEPATH)"; fi
output=terminal
cwd=$(VIM_ROOT)
save=2

[typescript-build]
command=PATH="/opt/homebrew/opt/node@22/bin:$PATH"; export PATH; R="$(VIM_ROOT)"; cd "$R" || exit 1; PM=npm; [ -f pnpm-lock.yaml ] && PM=pnpm; [ -f yarn.lock ] && PM=yarn; { [ -f bun.lock ] || [ -f bun.lockb ]; } && PM=bun; "$PM" --version >/dev/null 2>&1 || PM=npm; if [ -f package.json ] && node -e 'process.exit((require("./package.json").scripts||{}).build?0:1)' >/dev/null 2>&1; then "$PM" run build; else TOOLS="${NVIM_TYPESCRIPT_TOOLS:-$HOME/.local/share/nvim/typescript-tools}"; TSC="$R/node_modules/.bin/tsc"; [ -x "$TSC" ] || TSC="$TOOLS/node_modules/.bin/tsc"; if [ -f "$R/tsconfig.json" ]; then "$TSC" --pretty false --project "$R/tsconfig.json"; else "$TSC" --pretty false --target ES2022 --module NodeNext --moduleResolution NodeNext "$(VIM_FILEPATH)"; fi; fi
output=terminal
cwd=$(VIM_ROOT)
save=2

[typescript-test]
command=PATH="/opt/homebrew/opt/node@22/bin:$PATH"; export PATH; R="$(VIM_ROOT)"; cd "$R" || exit 1; PM=npm; [ -f pnpm-lock.yaml ] && PM=pnpm; [ -f yarn.lock ] && PM=yarn; { [ -f bun.lock ] || [ -f bun.lockb ]; } && PM=bun; "$PM" --version >/dev/null 2>&1 || PM=npm; if [ -f package.json ] && node -e 'process.exit((require("./package.json").scripts||{}).test?0:1)' >/dev/null 2>&1; then "$PM" run test; else echo "No test script in $R/package.json"; exit 1; fi
output=terminal
cwd=$(VIM_ROOT)
save=2

[quickfix-rg-grep]
command=rg -n --no-heading --color never "$(-word)" "." -tcpp -tc -tpy -tvim -tgo -tlua
cwd=.
errorformat=%f:%l:%m

[quickfix-rg-grep-project]
command=rg -n --no-heading --color never "$(-word)" "<root>" -tcpp -tc -tpy -tvim -tgo -tlua
cwd=$(VIM_ROOT)
errorformat=%f:%l:%m

[quickfix-rg-grep-filetype]
command=rg -n --no-heading --color never "$(-word)" "." $(-filetyps:-tcpp -tc -tpy -tvim -tgo -tlua)
cwd=.
errorformat=%f:%l:%m

[test]
command=echo $(-prompt:values)
cwd=<root>
output=terminal

; tmux related
; keep the most recently active client of every session, detach the rest
[tmux-prune-clients]
command=tmux lsc -F '#{client_session} #{client_activity} #{client_name}' | sort -k1,1 -k2,2nr | awk 'seen[$1]++ {print $3}' | while read -r c; do echo "detach $c"; tmux detach-client -t "$c"; done
cwd=.
output=terminal

; detach every client except the one running this task (must run inside tmux)
[tmux-keep-current-client]
command=if [ -z "$TMUX" ]; then echo "not inside tmux" >&2; exit 1; fi; me=$(tmux display-message -p '#{client_name}'); if [ -z "$me" ]; then echo "cannot identify the current client" >&2; exit 1; fi; tmux lsc -F '#{client_name}' | grep -vx -- "$me" | while read -r c; do echo "detach $c"; tmux detach-client -t "$c"; done
cwd=.
output=terminal

; detach the other clients of the current session only
[tmux-prune-current-session]
command=if [ -z "$TMUX" ]; then echo "not inside tmux" >&2; exit 1; fi; sess=$(tmux display-message -p '#S'); me=$(tmux display-message -p '#{client_name}'); if [ -z "$sess" ] || [ -z "$me" ]; then echo "cannot identify the current client" >&2; exit 1; fi; tmux lsc -F '#{client_session} #{client_name}' | awk -v s="$sess" -v me="$me" '$1 == s && $2 != me {print $2}' | while read -r c; do echo "detach $c"; tmux detach-client -t "$c"; done
cwd=.
output=terminal
